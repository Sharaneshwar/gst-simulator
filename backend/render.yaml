services:
  - type: web
    name: gst-practice-lab-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
